server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    location /api/ {
        proxy_pass http://api:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location / { try_files $uri /index.html; }
}
